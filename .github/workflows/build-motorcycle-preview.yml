name: Build Motorcycle Social Preview

on:
  push:
    branches: [main]
    paths:
      - 'motorcycle/tally-cover.svg'
      - '.github/workflows/build-motorcycle-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Render 1200x630 social preview
        run: |
          mkdir -p motorcycle
          rsvg-convert -w 1200 motorcycle/tally-cover.svg -o /tmp/motorcycle-preview.png
          convert /tmp/motorcycle-preview.png -background '#071827' -gravity center -extent 1200x630 motorcycle/motorcycle-social-preview.png

      - name: Commit preview if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorcycle/motorcycle-social-preview.png
          if git diff --cached --quiet; then
            echo 'No preview changes.'
          else
            git commit -m 'Generate motorcycle social preview'
            git push
          fi
